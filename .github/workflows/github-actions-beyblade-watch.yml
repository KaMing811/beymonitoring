# 放去 GitHub repo：.github/workflows/beyblade-watch.yml
name: Beyblade stock watch

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      - name: Run checker once
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python beyblade_stock_watch.py

      - name: Save snapshot into repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add beyblade_stock_state.json
          if git diff --staged --quiet; then
            echo "snapshot unchanged"
          else
            git commit -m "chore: update beyblade stock snapshot"
            git push
          fi
